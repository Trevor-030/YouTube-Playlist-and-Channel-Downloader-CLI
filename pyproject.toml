[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "1.0.0"
description = "YouTube playlist and channel downloader CLI (yt-dlp, rich, click)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]", "rich", "click"]

[project.scripts]
yt = "yt_downloader:cli"

[tool.setuptools]
py-modules = ["yt_downloader"]
