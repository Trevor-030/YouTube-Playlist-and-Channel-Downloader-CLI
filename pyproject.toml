[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-downloader"
version = "1.2.0"
description = "YouTube playlist, channel and transcript downloader CLI (yt-dlp, rich, click)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["yt-dlp[default]", "rich", "click", "youtube-transcript-api>=1.0.0"]

[project.optional-dependencies]
test = ["pytest", "pyflakes"]

[project.scripts]
yt = "yt_downloader:cli"

[tool.setuptools]
py-modules = ["yt_downloader"]
packages = ["ytdl"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
